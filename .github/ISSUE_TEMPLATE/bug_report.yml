name: Bug report
description: Report a reproducible problem in Veil
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove private URLs, vault data, passwords, and profile paths before submitting."
  - type: input
    id: version
    attributes:
      label: Veil version
      placeholder: "2.0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux family and desktop
      placeholder: "Fedora-family, KDE Plasma, Wayland"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chromium-family, version ..."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
