name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Python syntax
        run: python -m compileall -q veil
      - name: Unit and regression suite
        run: python -m pytest -q tests
      - name: Installer syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh
      - name: Documentation links
        run: python scripts/check_docs.py

  browser-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser extension smoke simulation
        run: node tests/browser_extension_smoke.cjs
      - name: Browser scaling simulation
        run: node tests/browser_scale.cjs
      - name: JavaScript syntax
        run: |
          find browser-extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check
