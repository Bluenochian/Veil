name: Source release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veil-source-release
  cancel-in-progress: false

jobs:
  publish:
    # Ordinary main-branch updates do not create releases.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'Release: Veil '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine source version and tag
        id: version
        shell: bash
        run: |
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install and verify release source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m compileall -q veil
          python -m pytest -q tests
          node tests/browser_extension_smoke.cjs
          node tests/browser_scale.cjs
          find browser-extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n scripts/install.sh scripts/uninstall.sh
          python scripts/check_docs.py
          test -s veil/data/adult_domains.db
          test -s DATA_LICENSE.md

      - name: Package source and checksum
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          archive="Veil-${TAG}-release.tar.gz"
          git archive --format=tar --prefix=Veil/ "$GITHUB_SHA" | gzip -9 > "$archive"
          sha256sum "$archive" > SHA256SUMS

      - name: Publish release if not already present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="Veil-${TAG}-release.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "Refreshing the existing release with this release commit."
              gh release upload "$TAG" "$archive" SHA256SUMS --clobber
              gh release edit "$TAG" --title "Veil $VERSION" --notes-file .github/RELEASE_NOTES.md --target "$GITHUB_SHA"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            else
              echo "Release $TAG already exists. Leaving it untouched."
            fi
            exit 0
          fi
          args=("$TAG" "$archive" SHA256SUMS --title "Veil $VERSION" --notes-file .github/RELEASE_NOTES.md)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "${args[@]}" --verify-tag
          else
            gh release create "${args[@]}" --target "$GITHUB_SHA"
          fi

      - name: Retire superseded release
        if: steps.version.outputs.tag == 'v1.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the first public Veil release under one version label.
          if gh release view v2.0.1 >/dev/null 2>&1; then
            gh release delete v2.0.1 --cleanup-tag --yes
          fi
